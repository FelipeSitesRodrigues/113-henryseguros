    <section class="ptopo" id="inicio" aria-labelledby="ptopo-titulo">
      <div class="ptopo__cartao">
        <img class="ptopo__foto" data-img="topo-{{s.id}}" data-preload sizes="(min-width: 64em) calc(100vw - 48px), 200vw" alt="{{s.alt}}" fetchpriority="high" decoding="async">
        <div class="ptopo__texto">
          <nav class="migalhas anim-hero-texto" style="--atraso:.1s" aria-label="Você está em"><a href="/">Início</a><span aria-hidden="true">/</span><a href="/#solucoes">Soluções</a><span aria-hidden="true">/</span><span aria-current="page">{{s.nome}}</span></nav>
          <p class="ptopo__etiqueta anim-hero-texto" style="--atraso:.2s">{{s.nome}}</p>
          <h1 class="ptopo__titulo anim-hero" id="ptopo-titulo" data-palavras><span class="ptopo__l1">{{s.h1a}}</span> <span class="ptopo__l2">{{s.h1b}}</span></h1>
          <p class="ptopo__sub anim-hero-texto" style="--atraso:.7s">{{s.sub}}</p>
          <div class="ptopo__botoes anim-hero-texto" style="--atraso:.9s" data-zap-depois>
            <a class="btn btn--vidro" href="{{wa-s}}" data-zap="topo-seguro" data-servico="{{s.nome}}" data-brilho><span class="brilho" aria-hidden="true"><span class="brilho__volta"><span class="brilho__ponto"></span></span></span><span class="brilho-fio" aria-hidden="true"><span class="brilho__ponto"></span></span>{{s.botao}}<i data-i="arrow-up-right" data-w="regular" class="i--anda"></i></a>
          </div>
        </div>
      </div>
    </section>
