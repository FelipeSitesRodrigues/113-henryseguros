    <!-- @usa sol-topo blog-cards -->
    <!-- página de um artigo do blog: topo petróleo com o título, a capa por cima da emenda, o
         texto numa coluna de leitura, a chamada do WhatsApp e "Leia também" -->
    <article class="post" aria-labelledby="ptopo-titulo">
      <header class="ptopo btopo btopo--post" id="inicio">
        <div class="ptopo__cartao btopo__cartao">
          <div class="ptopo__texto">
            <nav class="migalhas anim-hero-texto" style="--atraso:.1s" aria-label="Você está em"><a href="/">Início</a><span aria-hidden="true">/</span><a href="/blog">Blog</a><span aria-hidden="true">/</span><span aria-current="page">{{post.categoria}}</span></nav>
            <p class="ptopo__etiqueta anim-hero-texto" style="--atraso:.2s">{{post.categoria}}</p>
            <h1 class="ptopo__titulo post__titulo anim-hero" id="ptopo-titulo">{{post.titulo}}</h1>
            <p class="post__meta anim-hero-texto" style="--atraso:.5s"><span>Por Paulo Henrique de Oliveira</span><span aria-hidden="true">·</span><time datetime="{{post.dataIso}}">{{post.dataTexto}}</time><span aria-hidden="true">·</span><span>{{post.minutos}} min de leitura</span></p>
          </div>
        </div>
      </header>
      <div class="container post__corpo">
        <!-- @post-capa -->
        <div class="post__texto">
          <!-- @post-conteudo -->
        </div>
        <aside class="post__fala" aria-label="Fale com a Henry">
          <p class="post__fala-t">Ficou alguma dúvida sobre o seu caso?</p>
          <p class="post__fala-d">Um consultor da Henry explica pelo WhatsApp, sem compromisso.</p>
          <a class="btn btn--petroleo" href="{{wa:duvida}}" data-zap="post-duvida">Falar com um consultor<i data-i="whatsapp-logo" data-w="regular"></i></a>
        </aside>
      </div>
    </article>
    <!-- @post-relacionados -->
